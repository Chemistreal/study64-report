name: Build English media archive

on:
  workflow_dispatch:
  push:
    branches:
      - agent/english-media-archive
    paths:
      - media/english/archive/BUILD_RELEASE

permissions:
  contents: write

concurrency:
  group: english-media-v1
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: media/english/tools/requirements.txt

      - name: Install collector dependency
        run: python -m pip install -r media/english/tools/requirements.txt

      - name: Validate catalogs and cached audio
        run: python media/english/tools/validate_media.py

      - name: Build release archives from official origins
        run: python media/english/tools/collect_media.py archive --destination dist/english-media

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: english-media-v1
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --notes-file media/english/archive/RELEASE.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "English media archive v1" --notes-file media/english/archive/RELEASE.md
          fi
          gh release upload "$TAG" dist/english-media/* --clobber
