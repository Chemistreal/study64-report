# 화면 전수 검수. 어긋나면 빨간불.
#
# 이 저장소는 여태 **한 번도 자로 재어진 적이 없었다.** 처음 재어 보니
# (2026-08-09) 여섯 장 가운데 다섯 장이 걸렸다 —
#
#     학부모가 휴대폰으로 읽는 화면에 9px 글씨가 70곳
#     흐린 글씨 --muted 3.64:1 (본문 기준 4.5:1 미달)
#     표 머리에 scope 없음 70곳 · <h1> 없는 화면 한 장
#
# 눈으로는 셋 다 안 보인다. 그래서 기계가 매번 본다.
# 자는 exam·DT 저장소와 **같은 판**을 쓴다 — 갈라지면 한쪽만 고쳐진다.
name: 화면 검수

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # ⚠ `--check` 를 빼면 자는 재기만 하고 아무것도 막지 않는다.
      #   DT 저장소에서 그 상태로 여섯 달 동안 152장이 걸린 채 초록불이었다.
      - name: 화면 전수 검수 (대비 · 글씨 · 뼈대)
        timeout-minutes: 5
        run: python3 tools/audit_pages.py --check
      # 이 리포트에는 성적보다 사적인 것이 실린다 — 이름, 성향 프로필, 오개념,
      # 학부모용 종합 해설. 링크는 문자로만 보내지만 링크가 새는 길은 여럿이고,
      # 그러면 남는 보호막은 "주소를 남이 모른다" 하나뿐이다. 검색에서 뺀다.
      - name: 개인 리포트가 검색에 열려 있지 않다
        timeout-minutes: 5
        run: python3 tools/noindex.py --check
      # 화면 안에 박아 넣은 자바스크립트가 깨지면 화면은 통째로 아무 일도
      # 안 한다. 파일만 보면 멀쩡하고 검사도 통과한다 — 아무도 안 열어 보니까.
      # (CI 안에 직접 적어 두던 것을 DT·KMChC 와 같은 자로 바꿨다. 2026-08-10)
      - name: 화면 안 자바스크립트가 안 깨졌다
        timeout-minutes: 5
        run: python3 tools/js_syntax.py --check
      # 낭독기는 이름 없는 입력칸을 그냥 '편집' 이라고 읽는다 — 열 칸이 나란히
      # 있으면 열 번 다 '편집' 이다. 처음 재어 106칸 중 73칸은 자가 이어 주었고,
      # 남은 33칸은 화면을 봐야 알아 사람이 손으로 달았다(2026-08-10). 이제 0.
      - name: 입력칸에 이름이 붙어 있다
        timeout-minutes: 5
        run: python3 tools/input_labels.py --check
      # 바깥 stylesheet 를 만나면 브라우저는 그리기를 멈추고 기다린다. 학부모가
      # 휴대폰으로 여는 리포트에서 글꼴 한 줄 때문에 첫 화면이 늦어지면 안 된다.
      # 처음 재었을 때 세 장이 걸렸다(answers · report · 관리자).
      - name: 바깥 글꼴이 첫 화면을 막지 않는다
        timeout-minutes: 5
        run: python3 tools/font_block.py --check
      # ⚠ 검사 75개가 **아무도 안 돌리고 있었다.** 파일은 2026-06 부터 있었는데
      #   CI 가 부른 적이 없고, 기본 경로도 zip 시절의 /mnt/user-data/outputs/
      #   였다. 못 도는 것과 통과하는 것은 다르다 — 못 돌면 2 로 끝난다.
      - name: PRISM 회귀 75개 (12극 · 채점 · 저장 · 마이그레이션)
        timeout-minutes: 10
        run: |
          npm install --no-save jsdom
          node prism_regression.js
      # 이 리포트는 브라우저에 **PRISM 기록과 라벨**을 남긴다 —
      # prism_records_v1 · prism_labels_v1 은 지우면 잃는 것이다(시트에 없다).
      # 그 사실을 목록에 적어 두고, 새 칸이 조용히 생기면 한 번 묻게 한다.
      - name: 브라우저에 남기는 칸이 적어 둔 것뿐이다
        timeout-minutes: 5
        run: python3 tools/store_ledger.py --check
      # 아무 데서도 안 걸리는 화면은 **주소를 아는 사람만 열 수 있다.** 파일은
      # 남아 있고 검사도 지나가니 아무도 모른다. DT 에서 처음 세어 보니 여섯
      # 장이 그랬고 그중 셋은 1MB 짜리였다. 여기는 0장이다 — 0장인 채로 둔다.
      - name: 모든 화면에 문이 있다
        timeout-minutes: 5
        run: python3 tools/page_doors.py --check
      # 잘못 재는 자는 안 재느니만 못하다 — 사람이 경고를 무시하게 되고,
      # 그러면 진짜가 와도 안 본다. 자마다 맞혀야 할 참·거짓 예시를 붙여 두고,
      # 자를 고치다가 넓히거나 좁히면 여기서 걸리게 한다.
      - name: 자가 참·거짓 예시를 맞힌다
        timeout-minutes: 5
        run: python3 tools/lie_check.py --check
      # 화면이 **사람에게 하는 말**은 여태 아무도 안 셌다. 글자 크기와 대비는
      # 재면서 그 자리에 무엇이 적혀 있는지는 안 본 것이다. 학생과 학부모가
      # 실제로 가져가는 것은 그 문장이다 — 여기 4,810개가 있고 그중 570개는
      # 아이가 자기를 보는 방식을 만드는 평가 문장이다.
      # 여기서는 고치지 않는다. **줄어드는 것만** 막는다.
      - name: 사람에게 하는 말이 조용히 사라지지 않았다
        timeout-minutes: 5
        run: python3 tools/msg_ledger.py --check --quiet
      # 네 앱이 다 GitHub Pages 로 나가는데 **거기에 한도가 있다는 것을 아무도
      # 안 재고 있었다**(사이트 1GB · 파일 하나 100MB). 이 한도는 벽에 닿아야
      # 알게 된다 — 어느 날 배포가 멈추고, 그때서야 무엇이 무거운지 찾는다.
      # 그래서 벽이 아니라 **문턱(700MB)** 에서 켠다. 급하면 지우면 안 될 것을
      # 지우게 되므로, 고를 시간이 남아 있을 때 알린다.
      - name: 배포 한도에 여유가 있다
        timeout-minutes: 5
        run: python3 tools/pages_budget.py --check
      # 이 리포트는 **학부모가 문자로 받아 휴대폰으로 연다.** 이 값이 어긋나면
      # 그것을 보는 사람은 거의 다 휴대폰 사용자다. 지금 6장 모두 성하다.
      - name: 휴대폰 폭에서 화면이 옆으로 밀리지 않는다
        timeout-minutes: 10
        env:
          REQUIRE_BROWSER: '1'
        run: node tests/narrow.js
      # font_block.py 는 CSS 규칙만 읽는다. 규칙이 맞아도 **실제로 몇 초에**
      # 뜨는지는 안 본다 — 네 앱 어디서도 안 재던 값이다. 학부모가 문자로 받아
      # 여는 리포트라, 글꼴 창구가 늦으면 보는 것은 빈 흰 종이다.
      # 빠르기만 재면 '글꼴을 통째로 빼는 것' 이 만점을 받으므로 **오는지**도 잰다.
      - name: 글꼴이 안 와도 첫 그림이 뜬다
        timeout-minutes: 10
        env:
          REQUIRE_BROWSER: '1'
        run: node tests/first-paint.js
