name: TTS 스트리밍 서버 검증

on:
  pull_request:
    paths:
      - "tts-server/**"
      - "reader/index.html"
      - ".github/workflows/tts-server-check.yml"
  push:
    branches: [main]
    paths:
      - "tts-server/**"
      - "reader/index.html"
      - ".github/workflows/tts-server-check.yml"

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install server and test packages
        run: python -m pip install --quiet -r tts-server/requirements.txt pytest httpx
      - name: Check Python syntax and API contract
        working-directory: tts-server
        run: |
          python -m py_compile app.py
          python -m pytest -q test_app.py
      - name: Check that FFmpeg can produce HLS segments
        run: |
          command -v ffmpeg
          mkdir -p /tmp/yeobaek-hls-test
          ffmpeg -hide_banner -loglevel error -f lavfi -i "sine=frequency=440:duration=8" -ac 1 -ar 24000 -c:a aac -b:a 64k -f hls -hls_time 3 -hls_list_size 0 -hls_playlist_type event -hls_segment_filename "/tmp/yeobaek-hls-test/segment_%05d.ts" /tmp/yeobaek-hls-test/index.m3u8
          grep -q "EXTINF" /tmp/yeobaek-hls-test/index.m3u8
          find /tmp/yeobaek-hls-test -name '*.ts' | grep -q .
