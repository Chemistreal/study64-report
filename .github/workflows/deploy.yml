name: Deploy static content to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # 리더 오른쪽 위에 '업데이트 #PR번호 · 날짜 시각(한국 시간)'을 찍는다.
      - name: Stamp reader version
        run: |
          pr=$(git log -1 --format=%s | grep -oE '\(#[0-9]+\)$' | tr -d '()' || true)
          when=$(TZ=Asia/Seoul git log -1 --date=format-local:'%Y.%m.%d %H:%M' --format=%cd)
          sed -i "s|__YB_BUILD__|업데이트 ${pr:+$pr · }$when|" reader/index.html
          grep -o 'id="buildTag"[^<]*' reader/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      # GitHub Pages가 방금 올린 결과물을 '0개'로 보거나('No artifacts named … were found') '나중에 다시 시도'로 실패한다(2026-11, 올리기는 성공).
      # 목록에 늦게 잡히는 것이라 다시 올리지 않고, 기다렸다가 같은 결과물로 두 번까지 다시 배포한다.
      - name: Wait before retrying the deploy (1 min)
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait again (2 min)
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 120
      - name: Deploy to GitHub Pages (last retry)
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
