# 여백 오디오 저장소(Chemistreal/yeobaek-audio)의 워크플로. PC 작업실(publish.mjs)이 이 파일을 저장소에 넣는다 — 저장소에서 직접 고치지 마세요.
# 1) inbox/ 에 들어온 '현수 오디오 만들어 줘' 요청(아이폰 리더가 보낸 글)을 Edge 현수 목소리로 만들어 books/ 에 넣는다.
# 2) 저장소 내용을 GitHub Pages(https://chemistreal.github.io/yeobaek-audio/)로 배포한다(pages.yml).
name: 현수 오디오 만들기 · 사이트 배포

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      budget:
        description: '이번 실행에서 만들 시간(분). 1이면 곧바로 배포만 하고 다음 실행이 이어 만든다'
        required: false
        default: '90'
  schedule:
    - cron: '23 */2 * * *'   # 음성 서버가 막아 멈춘 책을 2시간마다 이어 만든다

permissions:
  contents: write
  actions: write   # 시간이 다 되어 멈추면 배포 뒤 이 워크플로를 다시 불러 이어 만든다
  pages: write
  id-token: write

concurrency:
  group: yeobaek-audio
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has: ${{ steps.inbox.outputs.has }}
      more: ${{ steps.make.outputs.more }}
    timeout-minutes: 340
    steps:
      - name: 오디오 저장소 받기(최신 main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 1
      - name: 요청이 있는지 보기
        id: inbox
        run: |
          # 실패로 적힌 요청만 남았으면 만들 것이 없다(리더에서 다시 보내면 error가 지워진다)
          if [ -n "$(grep -L '"error"' site/inbox/*.json 2>/dev/null)" ]; then echo "has=1" >> "$GITHUB_OUTPUT"; else echo "has=0" >> "$GITHUB_OUTPUT"; fi
      - name: 여백 작업실 엔진 받기
        if: steps.inbox.outputs.has == '1'
        uses: actions/checkout@v4
        with:
          repository: Chemistreal/study64-report
          ref: main
          path: tool
          sparse-checkout: reader
      - uses: actions/setup-python@v5
        if: steps.inbox.outputs.has == '1'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.inbox.outputs.has == '1'
        with:
          node-version: '22'
      - name: Edge 음성 도구 설치
        if: steps.inbox.outputs.has == '1'
        run: python -m pip install --quiet edge-tts imageio-ffmpeg
      # 만들던 문단(조각 소리)을 실행 사이에 이어 간다: 끊기거나 시간이 다 돼도 다음 실행이 받은 문단은 건너뛴다(2026-11-24: 90만 자 책이 음성 서버 거절로 4배 느려져 92%에서 끊김).
      - name: 만들던 문단 이어받기
        if: steps.inbox.outputs.has == '1'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/yeobaek-work
          key: yeobaek-work-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: yeobaek-work-
      - name: 현수 오디오 만들기(요청마다 완성되는 대로 올림)
        id: make
        if: steps.inbox.outputs.has == '1'
        timeout-minutes: 300
        # 한 번에 90분까지만 만들고 멈춘다(more=1) → 실행이 정상으로 끝나 배포되어 폰에 다 된 책이 보이고, 배포 뒤 다시 불려 이어 만든다.
        # 2026-11-25~28: 5시간 제한에 걸려 실패로 끝나면 배포가 건너뛰어져 다 만든 책 7권이 폰에 안 보였다. 그래도 죽으면 배포는 하도록 continue-on-error.
        continue-on-error: true
        env:
          YEOBAEK_BUDGET_MIN: ${{ github.event.inputs.budget || '90' }}
          YEOBAEK_PYTHON: python
          YEOBAEK_STUDIO_DIR: ${{ runner.temp }}/yeobaek
          GITHUB_TOKEN: ${{ github.token }}   # 진행률을 build-status 가지에 적는다(리더가 읽음)
        run: |
          git -C site config user.name "yeobaek-audio-bot"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tool/reader/pc-tool/inbox-build.mjs --site site
      - name: 만들던 문단 남기기(끊겨도 다음 실행이 이어서)
        if: always() && steps.inbox.outputs.has == '1'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/yeobaek-work
          key: yeobaek-work-${{ github.run_id }}-${{ github.run_attempt }}

  # 배포는 pages.yml(같은 폴더)이 한다. 책을 올리면 inbox-build.mjs가 곧바로 pages.yml을 불러, 90분 실행이 끝나기를 기다리지 않고 폰에 보인다(2026-11-28).
  deploy:
    needs: build
    if: github.event_name != 'schedule' || needs.build.outputs.has == '1'
    uses: ./.github/workflows/pages.yml

  # 시간이 다 되어 멈췄으면(만들 책이 남음) 배포가 끝난 뒤 곧바로 다음 실행을 부른다 — 2시간마다 오는 예약 실행을 기다리지 않게
  next:
    needs: [build, deploy]
    if: always() && needs.build.outputs.more == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 남은 책 이어 만들기 부르기
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml -R "$GITHUB_REPOSITORY" --ref main
