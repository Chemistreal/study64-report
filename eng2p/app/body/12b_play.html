<!-- ========== 판 ========== -->
<section id="t-play" role="region" aria-labelledby="h-play" tabindex="-1" hidden>
  <h2 id="h-play">판</h2>
  <!-- E단계 스무 판이 여기 붙는다. 붙는 대로 목록이 는다.
       **안 붙은 판을 목록에 안 적는다.** 적어 두면 눌러 보고 아무 일도 안 난다.
       그러면 두 사람이 앱이 고장 난 줄 안다. T259 -->
  <p class="lede noprint">한 판은 4~5분이다. 블록 안에서 돈다. <b>판마다 두 화면이 다른 것을 보인다.</b> 두 기기를 나란히 놓고 각자 자기 화면만 본다.</p>
  <!-- 종이에는 단추가 안 찍힌다. 그래서 이 탭을 그냥 인쇄하면 "판" 한 글자만
       나왔다 (T393). 목록은 종이에서도 쓸모가 있다. 어느 판이 몇 분인지가
       거기 있고 그것이 블록을 짜는 근거다. 단추를 글로 바꿔 찍는다. -->
  <div class="row" id="playList"></div>
  <p class="printonly">위는 판 목록이다. <b>판 하나를 열고 인쇄하면</b> 그 판의 종이 자리가 나온다.
    여기서 그냥 인쇄하면 목록만 나온다.</p>
  <div id="playPane"></div>
</section>
