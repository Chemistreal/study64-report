<section id="t-rules" role="region" aria-labelledby="h-rules" tabindex="-1" hidden>
  <h2 id="h-rules">세션 규칙 카드</h2>
  <p class="lede noprint">이 장만 인쇄해서 공부하는 자리 벽에 붙인다. 세션 중에 규칙이 헷갈리면 매뉴얼을 뒤지지 말고 벽을 본다.</p>
  <div class="row noprint"><button class="g" onclick="window.print()">인쇄</button></div>
  <div class="wallcard" id="wall"></div>

  <!-- 두 기기가 갈리는지 확인하는 자리. E단계 스무 판이 다 이 두 조각을 쓴다.
       판이 아직 없어서 여기서 미리 확인한다. 기기 쪽을 잘못 골라 놓으면
       판이 생긴 날 두 화면이 같은 것을 보이고, 그때는 이미 세션 중이다. T240 -->
  <h2>두 기기 확인</h2>
  <div class="card" id="splitCheck"></div>

  <!-- **손으로 안 적는다** (T396). 여기 적어 둔 목록에 없는 글쇠가 셋이었다.
       P 와 왼쪽과 오른쪽이다. 표는 `10_run.js` 의 `KEYS` 하나고 이 칸은
       그것을 읽어 그린다. `?` 를 눌러도 같은 표가 뜬다. -->
  <h2 id="h-keys">단축키</h2>
  <div class="card tight small" id="keyList"></div>
  <div class="small mut" style="margin-top:-6px">적는 칸에 손이 가 있을 때는 안 먹는다.
    <kbd>?</kbd> 를 누르면 어디서나 이 표가 뜬다.</div>

  <h2>금지 목록</h2>
  <h3>학습자 행위 금지</h3>
  <div class="scroll"><table id="banA"></table></div>
  <h3>제작물 작성 금지</h3>
  <div class="scroll"><table id="banB"></table></div>

  <h2>실패 지점</h2>
  <div class="scroll"><table id="failTbl"></table></div>
  <div class="note">예고된 어려움은 이탈 사유가 되지 않는다. 미리 읽어 둔다.</div>
</section>

<!-- 글쇠 목록 (T396). **? 를 눌러야 뜬다.**
     늘 떠 있으면 두 시간 내내 자리만 먹는다. 글쇠를 안 쓰는 사람이
     그 자리를 매일 보게 된다. -->
<div id="keyHelp" class="keyhelp" hidden></div>

<!-- 세션 조작줄. **오늘 탭 안에 있으면 안 된다.**
     블록 1은 미디어 탭으로 가서 40분을 듣는 블록이다. 그때 탭이 바뀌면
     오늘 탭이 통째로 숨고 타이머도 같이 사라진다. T113 에서 겪었다.
     페이지 바닥에 두면 어느 탭에서도 떠 있다. -->
  <!-- aria-hidden 을 안 건다 (T392). display:none 이 이미 낭독기와 초점 차례에서
       뺀다. 두 표시가 서로 다른 조건을 보면 보이는데 안 읽히는 자리가 생긴다. -->
  <div class="focusdock noprint" id="focusDock" aria-label="세션 빠른 조작">
    <!-- **세션 중에 딴 탭에 가면 돌아올 길이 없었다.**
         블록 1은 미디어 탭에서 듣는 블록이다. 그때 머리띠가 숨고 좁은 화면에서는
         탭도 숨는다. 조작줄에는 블록을 옮기는 것만 있었다.
         블록 칸은 세션 중에 제일 많이 보는 자리인데 그리로 못 돌아왔다. T182 -->
    <button class="g" id="focusHome" type="button" hidden>오늘</button>
    <div class="fstate"><b id="focusBlock">블록 1</b><span id="focusClock">40:00</span></div>
    <button class="g" id="focusLre" type="button">LRE +1</button>
    <!-- **상대가 다가올 때 손이 닿는 자리에 있어야 한다.** 격차 판에서
         상대 화면이 보이면 그 판이 무너진다. 단추를 찾아 헤매는 사이에 이미 보인다.
         조작줄은 세션 중에 늘 떠 있는 유일한 자리다. T244 -->
    <button class="g" id="focusVeil" type="button" aria-label="화면 가리기">가림</button>
    <!-- **되돌릴 자리가 여기 없었다.** 잘못 밀거나 잘못 눌러 넘어가면
         화면을 위로 올려 조작줄을 찾아야 했다. 40분짜리 블록이다.
         넘김이 손가락 하나로 되면 되돌림도 손가락 하나로 돼야 한다. -->
    <button class="g" id="focusPrev" type="button" aria-label="이전 블록">이전</button>
    <button class="b" id="focusToggle" type="button">일시정지</button>
    <button class="g" id="focusNext" type="button" aria-label="다음 블록">다음</button>
    <!-- **상대가 지금 어디인지는 이 기기가 모른다.** 망이 없다.
         대신 둘이 흘끗 견줄 수 있는 짧은 표시를 늘 띄운다. 어긋나면 맞춘다. T246 -->
    <button class="g mono" id="focusWhere" type="button"
            aria-label="이 기기 자리. 눌러서 상대와 맞춘다">1-40</button>
  </div>
  <!-- 자리 맞추기. 조작줄 밑에 붙는다. 세션 중에만 쓴다. -->
  <div class="wheredock noprint" id="whereDock" hidden></div>
